[project]
name = "workout-backend"
version = "0.1.0"
description = "Workout API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "psycopg2-binary>=2.9.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["db", "postgres_data", ".venv"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
