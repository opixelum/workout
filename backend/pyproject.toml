[project]
name = "workout"
version = "0.1.0"
description = "Workout API"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "ruff>=0.16.3",
    "sqlalchemy>=2.0.52",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["db", "postgres_data", ".venv"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workout"]
